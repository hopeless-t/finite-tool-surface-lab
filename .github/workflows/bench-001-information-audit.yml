name: BENCH-001 Information Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bench-001-information-audit.yml"
      - "src/finite_tool_surface_lab/bench001_information_audit.py"
      - "src/finite_tool_surface_lab/bench001.py"
      - "src/finite_tool_surface_lab/bench_metrics.py"
      - "src/finite_tool_surface_lab/synthetic.py"
      - "specs/BENCH-001.json"
      - "research/COUNCIL-008_BENCH001_INTERPRETATION.md"
      - "docs/THREATS_TO_VALIDITY.md"

permissions:
  contents: read

concurrency:
  group: bench-001-information-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run information audit
        run: |
          mkdir -p evidence/BENCH-001-AUDIT
          python -m finite_tool_surface_lab.bench001_information_audit \
            --spec specs/BENCH-001.json \
            --out evidence/BENCH-001-AUDIT/information-audit.json \
            --markdown evidence/BENCH-001-AUDIT/summary.md

      - name: Summary
        run: cat evidence/BENCH-001-AUDIT/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BENCH-001-AUDIT-${{ github.run_id }}
          path: evidence/BENCH-001-AUDIT/
          if-no-files-found: error
          retention-days: 90

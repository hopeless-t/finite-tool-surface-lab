name: BENCH-001 Reference Replay

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bench-001-reference-replay.yml"
      - "research/COUNCIL-009_BENCH001_REFERENCE_PROMOTION.md"
      - "src/finite_tool_surface_lab/bench001.py"
      - "src/finite_tool_surface_lab/bench_metrics.py"
      - "src/finite_tool_surface_lab/retrieval.py"
      - "src/finite_tool_surface_lab/synthetic.py"
      - "specs/BENCH-001.json"

permissions:
  contents: read

concurrency:
  group: bench-001-reference-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e .

      - name: Full deterministic replay
        run: |
          python -m finite_tool_surface_lab.bench001 \
            --spec specs/BENCH-001.json \
            --out "evidence/BENCH-001/replay-${{ matrix.python }}"

      - name: Stable research-output digests
        run: |
          cd "evidence/BENCH-001/replay-${{ matrix.python }}"
          sha256sum \
            summary.json \
            per_task.jsonl \
            invalid_cells.jsonl \
            aggregates.jsonl \
            retrieval_frontier.json \
            | sort -k2 > stable-digests.sha256
          cat stable-digests.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: bench001-replay-${{ matrix.python }}
          path: evidence/BENCH-001/replay-${{ matrix.python }}/
          if-no-files-found: error
          retention-days: 90

  compare:
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bench001-replay-*
          path: replay

      - name: Compare stable outputs
        run: |
          set -euo pipefail
          diff -u \
            replay/bench001-replay-3.12/stable-digests.sha256 \
            replay/bench001-replay-3.13/stable-digests.sha256

          python - <<'PY'
          import json
          from pathlib import Path

          roots = {
              "3.12": Path("replay/bench001-replay-3.12"),
              "3.13": Path("replay/bench001-replay-3.13"),
          }
          summaries = {
              version: json.loads((root / "summary.json").read_text())
              for version, root in roots.items()
          }
          assert all(s["state"] == "PASS" for s in summaries.values())
          assert summaries["3.12"] == summaries["3.13"]

          result = {
              "study_id": "BENCH-001-REFERENCE-REPLAY",
              "state": "PASS",
              "comparison": "BYTE_IDENTICAL_STABLE_OUTPUTS",
              "python_versions": ["3.12", "3.13"],
              "raw_rows": summaries["3.12"]["raw_rows"],
              "aggregate_rows": summaries["3.12"]["aggregate_rows"],
              "frontier_points": summaries["3.12"]["frontier_points"],
          }
          Path("replay/reference-replay.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # BENCH-001 independent reference replay

          - Python 3.12: FULL PASS
          - Python 3.13: FULL PASS
          - Stable outputs compared: summary, raw per-task, invalid cells, aggregates, frontier
          - Runtime-specific manifest intentionally excluded
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: BENCH-001-REFERENCE-REPLAY-${{ github.run_id }}
          path: replay/reference-replay.json
          if-no-files-found: error
          retention-days: 90

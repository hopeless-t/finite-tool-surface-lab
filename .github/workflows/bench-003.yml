name: BENCH-003 Distractor Topology

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bench-003.yml"
      - "src/finite_tool_surface_lab/distractor_synthetic.py"
      - "src/finite_tool_surface_lab/bench003.py"
      - "src/finite_tool_surface_lab/adaptive.py"
      - "src/finite_tool_surface_lab/retrieval.py"
      - "specs/BENCH-003.json"
      - "docs/BENCH-003.md"
      - "research/COUNCIL-018_BENCH003_GENERATOR.md"

permissions:
  contents: read

concurrency:
  group: bench-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run full benchmark
        run: |
          python -m finite_tool_surface_lab.bench003 \
            --spec specs/BENCH-003.json \
            --out evidence/BENCH-003/run

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          s=json.load(open("evidence/BENCH-003/run/summary.json"))
          print("# BENCH-003")
          print()
          print(f"State: **{s['state']}**")
          print(f"Policy observations: **{s['observation_count']:,}**")
          print(f"Aggregate rows: **{s['aggregate_rows']:,}**")
          print(f"Frontier points: **{s['frontier_points']:,}**")
          print(
              "All-required coverage range: "
              f"**{s['all_required_rate_range']}**"
          )
          print(
              "Wrong-distractor inclusion range: "
              f"**{s['wrong_distractor_inclusion_rate_range']}**"
          )
          print()
          print(s["claim_ceiling"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: BENCH-003-${{ github.run_id }}
          path: evidence/BENCH-003/run/
          if-no-files-found: error
          retention-days: 90

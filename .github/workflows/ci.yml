name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Compile
        run: python -m compileall -q src tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: VAL-001 smoke
        run: |
          python -m finite_tool_surface_lab.val001 \
            --spec specs/VAL-001.json \
            --out runs/VAL-001-smoke \
            --quick
          python -m json.tool runs/VAL-001-smoke/metrics.json >/dev/null

      - name: BENCH-001 smoke
        run: |
          python -m finite_tool_surface_lab.bench001 \
            --spec specs/BENCH-001.json \
            --out runs/BENCH-001-smoke \
            --quick
          python -m json.tool runs/BENCH-001-smoke/summary.json >/dev/null

      - name: BENCH-002 smoke
        run: |
          python -m finite_tool_surface_lab.bench002 \
            --spec specs/BENCH-002.json \
            --out runs/BENCH-002-smoke \
            --quick
          python -m json.tool runs/BENCH-002-smoke/summary.json >/dev/null


      - name: BENCH-003 smoke
        run: |
          python -m finite_tool_surface_lab.bench003 \
            --spec specs/BENCH-003.json \
            --out runs/BENCH-003-smoke \
            --quick
          python -m json.tool runs/BENCH-003-smoke/summary.json >/dev/null


      - name: BENCH-004 smoke
        run: |
          python -m finite_tool_surface_lab.bench004 \
            --spec specs/BENCH-004.json \
            --out runs/BENCH-004-smoke \
            --quick
          python -m json.tool runs/BENCH-004-smoke/summary.json >/dev/null

name: VAL-001 Synthetic Harness

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/val-001.yml"
      - "src/finite_tool_surface_lab/synthetic.py"
      - "src/finite_tool_surface_lab/policies.py"
      - "src/finite_tool_surface_lab/validation.py"
      - "src/finite_tool_surface_lab/evidence.py"
      - "src/finite_tool_surface_lab/val001.py"
      - "specs/VAL-001.json"
      - "docs/VAL-001.md"

permissions:
  contents: read

concurrency:
  group: val-001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .

      - name: Run full validation
        run: |
          python -m finite_tool_surface_lab.val001 \
            --spec specs/VAL-001.json \
            --out evidence/VAL-001/run

      - name: Summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m=json.load(open("evidence/VAL-001/run/metrics.json"))
          print("# VAL-001")
          print()
          print(f"State: **{m['state']}**")
          print(f"Cells: **{m['cells']}**")
          print(f"Tasks: **{m['tasks']}**")
          print(f"Max random/theory abs error: **{m['max_random_theory_abs_error']:.6f}**")
          print()
          print("This validates the harness only; it is not a Worker-performance result.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: VAL-001-${{ github.run_id }}
          path: evidence/VAL-001/run/
          if-no-files-found: error
          retention-days: 90
